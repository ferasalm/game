# Runs tools/check.sh (docs, lint, Godot import, tests) on every push and pull request.
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ hashFiles('.godot-version') }}
      - run: tools/check.sh
      - if: failure()
        run: tail -n 60 .check/*.log
