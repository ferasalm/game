# Builder limits and defaults (DECISIONS 2026-10-27 D1); sourced by tools/lib.sh. An env var set earlier wins (tests).
: "${CAP_GODOT:=2}"      # Godot runs at once, agy + cf together
: "${CAP_AGY:=2}"
: "${CAP_CF:=2}"
: "${CAP_OC:=1}"         # the one free text run (opencode/OpenRouter :free, no Godot)
: "${MIN_FREE_MB:=3000}" # free virtual memory floor before a run starts (4 runs + Godot froze the app, 2026-10-26)
: "${FIX_PASSES:=2}"   # free fix passes after a failed check (Feras 10-28: builder time is free)
: "${IDLE_MIN:=25}"      # no commit for this long: the pipeline kills the builder (NOWORK)
: "${BG_WAIT_SEC:=300}"  # a builder's check moved to the background and no commit for this long: killed, its work checked
: "${OC_BG_MSG:=Command moved to the background}" # opencode v2's line for a backgrounded command
: "${FORK_FAIL_RE:=fork: retry|dofork: child|child_copy}" # git bash out of memory: the run's failure is the PC's, not the model's
# opencode v2.2.2 pinned beside v1.19.4 (npm `opencode`), row 18 10-30; flags and data dir: oc_run (lib.sh).
# Rollback to v1: OC_BIN=opencode OC_MAJOR=1 (v2's own database is ~/.local/share/oc-v2; v1 keeps oc-cli)
: "${OC_BIN:=$HOME/.local/opt/opencode-2.2.2/opencode.exe}"
: "${OC_MAJOR:=2}"
: "${OC_MODEL:=opencode/deepseek-v4.1-flash-free}"
: "${OC_QUOTA_MSG:=Free usage limit reached}" # opencode's error when its free models are spent (it still exits 0)
# opencode's hidden output cap (default 32k) cut DeepSeek 1017 off mid-thought; 384k = its full output (Feras 10-30;
# a review at max used 66k; REVIEW_TIMEOUT and IDLE_MIN stop a runaway long before 384k). v1 reads this variable;
# v2 dropped it and reads limit.output on the model in opencode.json and cross_review.opencode.json
: "${OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX:=384000}"; export OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX
: "${AGY_MODEL:=gemini-3.8-flash-medium}"  # Feras 10-31; agy offers low, medium, high
: "${CF_MODEL:=cloudflare-workers-ai/@cf/deepseek-ai/deepseek-v4.1-flash-1017}"
: "${CF_FAST_MODEL:=cloudflare-workers-ai/deepseek-v4.1-flash-fast}" # the same model, reasoning_effort none (opencode.json)
: "${CF_INPUT_RATE:=0.30}"   # cf spend lines (slots.sh append-spend): USD per million tokens, in and out
: "${CF_OUTPUT_RATE:=1.20}"
: "${XR_OC_MODEL:=openrouter/nvidia/nemotron-3-ultra-550b-a55b:free}" # backup lens only (Feras 10-30): after cf fails twice
: "${REVIEW_TIMEOUT:=15m}" # each cross-review call, the forced round too (nemotron takes ~7 min; a 5m retry after a dropped socket timed out, 10-29)
