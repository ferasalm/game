# Builder limits and defaults (DECISIONS 2026-10-27 D1); sourced by tools/lib.sh. An env var set earlier wins (tests).
: "${CAP_GODOT:=2}"      # Godot runs at once, agy + nv together
: "${CAP_AGY:=2}"
: "${CAP_NV:=3}"         # NVIDIA NIM free tier: ~40 requests/min per key, shared by every nv run
: "${CAP_OC:=1}"         # the one free text run (opencode/OpenRouter :free, no Godot)
: "${MIN_FREE_MB:=2000}" # available PHYSICAL memory floor (Feras 11-01: was 3000 virtual) before a run starts (4 runs + Godot froze the app, 2026-10-26)
: "${FIX_PASSES:=2}"   # free fix passes after a failed check (Feras 10-28: builder time is free)
: "${IDLE_MIN:=25}"      # no commit for this long: the pipeline kills the builder (NOWORK)
: "${QUIET_SEC:=300}"    # a commit made in THIS call, then no log growth and no .check/alive beat (check.sh) for this long: killed, its commits checked (row25-base-red lost 25 of 31 min to a builder that hung after its last commit)
: "${BG_WAIT_SEC:=300}"  # a builder's check moved to the background and no commit for this long: killed, its work checked
: "${BASE_RED_SEC:=600}"  # tools/base_red.py at launch: a slower run warns and the build goes on
: "${OC_BG_MSG:=Command moved to the background}" # opencode v2's line for a backgrounded command
: "${FORK_FAIL_RE:=fork: retry|dofork: child|child_copy}" # git bash out of memory: the run's failure is the PC's, not the model's
# opencode v2.2.2 pinned beside v1.19.4 (npm `opencode`), row 18 10-30; flags and data dir: oc_run (lib.sh).
# Rollback to v1: OC_BIN=opencode OC_MAJOR=1 (v2's own database is ~/.local/share/oc-v2; v1 keeps oc-cli)
: "${OC_BIN:=$HOME/.local/opt/opencode-2.2.2/opencode.exe}"
: "${OC_MAJOR:=2}"
# Cloudflare retired 11-04 (Feras: an unexpected $32.29 bill on a lane with no cap). Every model slug a builder may use
# starts with a provider in tools/free_providers.txt (test_free_providers.py fails otherwise).
: "${NV_MODEL:=nvidia/deepseek-ai/deepseek-v4.1-flash}"  # first: OC_MODEL and XR_REVIEWER_GLM default to it
# Free fallback chain (Feras 11-04, may grow): nv_build.sh retries the run on the next model when the provider refused
# it (NV_FALLBACK_RE in the run's log); a model's own failure (red check, no commit) never falls through.
: "${NV_CHAIN:=nvidia/deepseek-ai/deepseek-v4.1-flash opencode/deepseek-v4.1-flash-free cerebras/qwen-3.8-27b openrouter/nvidia/nemotron-3-ultra-550b-a55b:free}"
: "${NV_FALLBACK_RE:=Free usage limit reached|Rate limit exceeded|rate_limit_exceeded|Too Many Requests|status code 429|insufficient_quota|503 Service Unavailable}"  # provider wording only: a model writing about rate limits must not match
: "${OC_MODEL:=$NV_MODEL}"  # the nv model is the text default
: "${OC_QUOTA_MSG:=Free usage limit reached}" # opencode's error when its free models are spent (it still exits 0)
: "${OC_START_TRIES:=3}"   # opencode v2 servers started in the same second collide on one SQLite database (row 26, 11-02): a startup failure is retried
: "${OC_START_FAIL_RE:=database is locked|exited before reporting readiness}" # what a startup collision prints; a real failure never matches
# opencode's hidden output cap (default 32k) cut DeepSeek off mid-thought (10-30). v1 reads this variable; v2 reads
# limit.output on the model in opencode.json and cross_review.opencode.json
: "${OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX:=384000}"; export OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX
: "${AGY_MODEL:=gemini-3.8-flash-medium}"  # Feras 10-31; agy offers low, medium, high
: "${NV_INPUT_RATE:=0}"    # token lines (slots.sh append-spend) keep the meter; every allowed provider is free, so USD 0
: "${NV_OUTPUT_RATE:=0}"
: "${XR_OC_MODEL:=openrouter/nvidia/nemotron-3-ultra-550b-a55b:free}" # backup lens only (Feras 10-30): after nv fails twice
: "${XR_OC_TIMEOUT:=5m}"   # a Nemotron call (Feras 10-31): speed is its one merit; no answer in 5 min = no lens, Claude's gate still runs
# Who reviews whom (row 26 S4, Feras 11-02): agy (gemini) and DeepSeek runs go to GLM; GLM runs go to DeepSeek.
# The run's .result names the family; these are the models, so a family never reviews its own work.
: "${XR_REVIEWER_GEMINI:=nvidia/z-ai/glm-5.3-flash}"
: "${XR_REVIEWER_DEEPSEEK:=nvidia/z-ai/glm-5.3-flash}"
: "${XR_REVIEWER_GLM:=$NV_MODEL}"
: "${CI_WAIT_SEC:=960}"    # handoff.sh's --main ci wait cap: CI may take 15 min, and 600 s gave up too early (Feras 11-02)
: "${REVIEW_TIMEOUT:=15m}" # each nv or agy cross-review call, the forced round too
