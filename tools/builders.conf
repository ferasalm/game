# Builder limits and defaults (DECISIONS 2026-10-27 D1); sourced by tools/lib.sh. An env var set earlier wins (tests).
: "${CAP_GODOT:=2}"      # Godot runs at once, agy + cf together
: "${CAP_AGY:=2}"
: "${CAP_CF:=2}"
: "${CAP_OC:=1}"         # the one free text run (opencode/OpenRouter :free, no Godot)
: "${MIN_FREE_MB:=3000}" # free virtual memory floor before a run starts (4 runs + Godot froze the app, 2026-10-26)
: "${FIX_PASSES:=2}"   # free fix passes after a failed check (Feras 10-28: builder time is free)
: "${IDLE_MIN:=25}"      # no commit for this long: the pipeline kills the builder (NOWORK)
: "${OC_MODEL:=opencode/deepseek-v4.1-flash-free}"
: "${AGY_MODEL:=gemini-3.8-flash-high}"
: "${CF_MODEL:=cloudflare-workers-ai/@cf/deepseek-ai/deepseek-v4.1-flash-1017}"
: "${CF_INPUT_RATE:=0.30}"   # cf spend lines (slots.sh append-spend): USD per million tokens, in and out
: "${CF_OUTPUT_RATE:=1.20}"
: "${REVIEW_TIMEOUT:=15m}" # one cross-review call (tools/cross_review.sh); the forced round gets 5m
